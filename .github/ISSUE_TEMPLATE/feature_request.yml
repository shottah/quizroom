name: Feature request
description: Suggest an idea or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you considered
