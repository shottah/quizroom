server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Resolve the backend per request, so a recreated backend container
  # (new IP) doesn't leave nginx pointing at a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  location = /openapi.json {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
